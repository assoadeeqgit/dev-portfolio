<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Assoadeeq — Full-Stack Developer</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Syne', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
        colors: {
          accent: '#8EB69B',
          accentLight: '#DAF1DE',
          accentDark: '#235347',
          teal: '#163832',
          dark: '#051F20',
          dark2: '#0B2B26',
          dark3: '#163832',
        },
      }
    }
  }
</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:#051F20;overflow-x:hidden}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:#051F20}
  ::-webkit-scrollbar-thumb{background:#8EB69B;border-radius:2px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-10px)}}
  @keyframes particle{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100vh) translateX(50px);opacity:0}}
  @keyframes cursorGlow{0%,100%{box-shadow:0 0 20px #8EB69B,0 0 40px #8EB69B}50%{box-shadow:0 0 30px #235347,0 0 60px #235347}}
  .fade1{opacity:0;animation:fadeUp .6s ease .1s forwards}
  .fade2{opacity:0;animation:fadeUp .6s ease .2s forwards}
  .fade3{opacity:0;animation:fadeUp .6s ease .3s forwards}
  .fade4{opacity:0;animation:fadeUp .6s ease .4s forwards}
  .fade5{opacity:0;animation:fadeUp .6s ease .5s forwards}
  .blink{animation:blink 1s step-end infinite}
  .pulse{animation:pulse 2s ease infinite}
  .particle{position:absolute;width:4px;height:4px;background:#8EB69B;border-radius:50%;opacity:0;animation:particle linear infinite;box-shadow:0 0 10px #8EB69B}
  .card{transition:all .3s ease}
  .card:hover{transform:translateY(-4px);border-color:rgba(142,182,155,.4)!important;box-shadow:0 10px 30px rgba(142,182,155,.2)}
  .card:hover .topbar{transform:scaleX(1)!important}
  .topbar{transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
  .skill-card{transition:all .25s ease}
  .skill-card:hover{background:rgba(142,182,155,.08);border-color:rgba(142,182,155,.3)!important;transform:translateY(-2px)}
  .clink{transition:all .2s ease}
  .clink:hover{border-color:rgba(142,182,155,.5)!important;color:#8EB69B!important;transform:translateX(4px)}
  input,textarea{outline:none}
  input:focus,textarea:focus{border-color:#8EB69B!important;box-shadow:0 0 0 2px rgba(142,182,155,.2)}
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:translateY(0)}
  .navlink{position:relative}
  .navlink::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:linear-gradient(90deg,#8EB69B,#235347);transform:scaleX(0);transition:transform .2s}
  .navlink:hover::after{transform:scaleX(1)}
  .gradient-text{background:linear-gradient(135deg,#8EB69B,#235347);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .cursor-glow{position:fixed;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#8EB69B,transparent);pointer-events:none;z-index:9999;mix-blend-mode:screen;animation:cursorGlow 2s ease-in-out infinite;transition:transform .1s ease}
</style>
</head>
<body class="bg-dark text-gray-100 font-mono">
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const SKILLS = [
  {icon:'⚛',name:'React & Frontend',desc:'Responsive UIs, component architecture, and modern design systems.'},
  {icon:'⬡',name:'Node.js & Backend',desc:'REST APIs, Express, server-side logic and full-stack JS development.'},
  {icon:'🐘',name:'PHP & MySQL',desc:'Dynamic web apps, database design, and server-side scripting.'},
  {icon:'🐍',name:'Python',desc:'Automation scripts, data processing, and backend tooling.'},
  {icon:'☁',name:'Cloud & DevOps',desc:'DigitalOcean, NGINX, Linux server management and CI/CD pipelines.'},
  {icon:'◈',name:'UI/UX Design',desc:'User-focused design, wireframing, and intuitive experiences.'},
  {icon:'📡',name:'RF & Networking',desc:'Antenna design, RF engineering, and network infrastructure.'},
  {icon:'⚙',name:'Automation',desc:'Workflow automation consulting and process optimization.'},
];

const PROJECTS = [
  {status:'wip',label:'In Progress',name:'POS & Inventory System',desc:'A full-stack point-of-sale and online inventory management system built for small businesses.',tags:['React','Node.js','MySQL','NGINX'],link:null},
  {status:'live',label:'Live',name:'dev.lunobyte.com',desc:'Personal dev server running NGINX, Node, PHP, MySQL and Python on Ubuntu 24.04 LTS.',tags:['DigitalOcean','NGINX','Ubuntu','SSL'],link:'https://dev.lunobyte.com'},
  {status:'planned',label:'Coming Soon',name:'More Projects',desc:'Working through a structured full-stack roadmap. React → Full-Stack → Deployment/DevOps.',tags:['React','Full-Stack','DevOps'],link:null},
];

function Badge({status,label}){
  const s={live:'bg-accent/10 text-accent border-accent/30',wip:'bg-yellow-500/10 text-yellow-400 border-yellow-500/30',planned:'bg-white/5 text-gray-500 border-white/10'};
  return(
    <span className={`inline-flex items-center gap-1.5 text-[10px] tracking-widest uppercase px-2.5 py-1 rounded-sm font-mono border ${s[status]}`}>
      {status==='live'&&<span className="w-1.5 h-1.5 rounded-full bg-accent pulse"></span>}
      {label}
    </span>
  );
}

function Particles(){
  return(
    <div className="fixed inset-0 pointer-events-none overflow-hidden">
      {[...Array(20)].map((_,i)=>(
        <div key={i} className="particle" style={{left:`${Math.random()*100}%`,animationDuration:`${15+Math.random()*10}s`,animationDelay:`${Math.random()*5}s`}}/>
      ))}
    </div>
  );
}

function Terminal(){
  return(
    <div className="bg-dark2 border border-white/8 rounded-xl overflow-hidden fade5" style={{boxShadow:'0 0 60px rgba(0,229,160,0.06)'}}>
      <div className="bg-dark3 px-4 py-3 flex items-center gap-2 border-b border-white/5">
        <div className="w-3 h-3 rounded-full bg-red-500/80"></div>
        <div className="w-3 h-3 rounded-full bg-yellow-400/80"></div>
        <div className="w-3 h-3 rounded-full bg-green-500/80"></div>
        <span className="ml-auto mr-auto text-[11px] text-gray-600">assoadeeq@dev-server-01 — zsh</span>
      </div>
      <div className="p-5 text-[12px] leading-loose">
        <div><span className="text-accent">~$</span><span className="text-white ml-2">whoami</span></div>
        <div className="text-gray-500">assoadeeq — full-stack developer</div>
        <div className="h-2"/>
        <div><span className="text-accent">~$</span><span className="text-white ml-2">cat skills.json</span></div>
        <div className="text-gray-500">{'{'}</div>
        <div className="pl-4"><span className="text-blue-400">"frontend"</span><span className="text-gray-500">: </span><span className="text-green-400">["React", "HTML", "CSS"]</span><span className="text-gray-500">,</span></div>
        <div className="pl-4"><span className="text-blue-400">"backend"</span><span className="text-gray-500">: </span><span className="text-green-400">["Node.js", "PHP", "Python"]</span><span className="text-gray-500">,</span></div>
        <div className="pl-4"><span className="text-blue-400">"cloud"</span><span className="text-gray-500">: </span><span className="text-green-400">["DigitalOcean", "NGINX"]</span><span className="text-gray-500">,</span></div>
        <div className="pl-4"><span className="text-blue-400">"location"</span><span className="text-gray-500">: </span><span className="text-yellow-400">"Abuja, Nigeria"</span></div>
        <div className="text-gray-500">{'}'}</div>
        <div className="h-2"/>
        <div><span className="text-accent">~$</span><span className="text-white ml-2">uptime</span></div>
        <div className="text-gray-500">server running — 99.9% uptime ✓</div>
        <div className="h-2"/>
        <div><span className="text-accent">~$</span><span className="ml-2 inline-block w-2 h-3.5 bg-accent align-middle blink"></span></div>
      </div>
    </div>
  );
}

function useReveal(ref){
  const [v,setV]=useState(false);
  useEffect(()=>{
    const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){setV(true);o.disconnect();}},{threshold:0.12});
    if(ref.current)o.observe(ref.current);
    return()=>o.disconnect();
  },[]);
  return v;
}

function Sec({id,children}){
  const ref=useRef();
  const v=useReveal(ref);
  return(
    <section id={id} ref={ref} className={`reveal ${v?'in':''} max-w-7xl mx-auto px-6 py-24`}>
      {children}
    </section>
  );
}

function Header({label,title}){
  return(
    <div className="mb-12">
      <p className="text-[11px] tracking-[.2em] uppercase text-accent font-mono mb-2">{label}</p>
      <h2 className="font-sans font-extrabold text-4xl text-white tracking-tight">{title}</h2>
    </div>
  );
}

function App(){
  const [scrolled,setScrolled]=useState(false);
  const [form,setForm]=useState({name:'',email:'',message:''});
  const [sent,setSent]=useState(false);
  const [menu,setMenu]=useState(false);
  const [cursor,setCursor]=useState({x:0,y:0});

  useEffect(()=>{
    const h=()=>setScrolled(window.scrollY>40);
    window.addEventListener('scroll',h);
    return()=>window.removeEventListener('scroll',h);
  },[]);

  useEffect(()=>{
    const move=(e)=>setCursor({x:e.clientX,y:e.clientY});
    window.addEventListener('mousemove',move);
    return()=>window.removeEventListener('mousemove',move);
  },[]);

  const submit=e=>{
    e.preventDefault();
    setSent(true);
    setForm({name:'',email:'',message:''});
    setTimeout(()=>setSent(false),3000);
  };

  return(
    <div className="min-h-screen">
      <div className="cursor-glow" style={{left:`${cursor.x}px`,top:`${cursor.y}px`,transform:'translate(-50%,-50%)'}}/>
      <Particles/>

      {/* NAV */}
      <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${scrolled?'bg-dark/90 backdrop-blur-xl border-b border-white/5':''}`}>
        <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
          <a href="#" className="font-sans font-extrabold text-lg text-accent tracking-tight">
            assoadeeq<span className="text-white">.</span>dev
          </a>
          <ul className="hidden md:flex gap-8">
            {['Skills','Projects','Contact'].map(l=>(
              <li key={l}>
                <a href={`#${l.toLowerCase()}`} className="navlink text-gray-500 hover:text-white text-[11px] tracking-widest uppercase transition-colors font-mono">{l}</a>
              </li>
            ))}
          </ul>
          <a href="mailto:assoadeeq@gmail.com" className="hidden md:block text-[11px] font-mono border border-white/10 hover:border-accent/40 hover:text-accent text-gray-400 px-4 py-2 rounded-sm transition-all">
            Hire Me
          </a>
          <button onClick={()=>setMenu(!menu)} className="md:hidden text-gray-400 hover:text-white">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              {menu?<path d="M4 4L16 16M4 16L16 4" stroke="currentColor" strokeWidth="1.5"/>:<path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" strokeWidth="1.5"/>}
            </svg>
          </button>
        </div>
        {menu&&(
          <div className="md:hidden bg-dark2 border-t border-white/5 px-6 py-4 flex flex-col gap-4">
            {['Skills','Projects','Contact'].map(l=>(
              <a key={l} href={`#${l.toLowerCase()}`} onClick={()=>setMenu(false)} className="text-gray-400 hover:text-accent text-sm font-mono tracking-widest uppercase">{l}</a>
            ))}
          </div>
        )}
      </nav>

      {/* HERO */}
      <div className="min-h-screen flex items-center pt-20 pb-12 relative overflow-hidden">
        <div className="absolute top-0 right-0 w-[700px] h-[700px] rounded-full pointer-events-none" style={{background:'radial-gradient(circle,rgba(142,182,155,0.1) 0%,transparent 70%)',filter:'blur(80px)'}}/>
        <div className="absolute bottom-0 left-0 w-[500px] h-[500px] rounded-full pointer-events-none" style={{background:'radial-gradient(circle,rgba(35,83,71,0.08) 0%,transparent 70%)',filter:'blur(80px)'}}/>

        <div className="max-w-7xl mx-auto px-6 w-full grid grid-cols-1 lg:grid-cols-2 gap-16 items-center relative z-10">
          <div className="order-2 lg:order-1">
            <div className="fade1 inline-flex items-center gap-2 border border-accent/20 text-accent text-[10px] tracking-widest uppercase px-3 py-1.5 rounded-full font-mono mb-6" style={{background:'rgba(0,229,160,0.06)'}}>
              <span className="w-1.5 h-1.5 rounded-full bg-accent pulse"/>
              Available for freelance work
            </div>
            <h1 className="fade2 font-sans font-extrabold text-white leading-[1.06] tracking-tight mb-6" style={{fontSize:'clamp(2.5rem,5vw,3.8rem)'}}>
              Hi, I'm<br/><span className="gradient-text">Assoadeeq</span>.<br/>I build for<br/>the web.
            </h1>
            <p className="fade3 text-gray-500 text-sm leading-relaxed mb-8 max-w-sm font-mono">
              Full-stack developer crafting responsive web solutions, digital tools, and cloud infrastructure. Based in Abuja, Nigeria.
            </p>
            <div className="fade4 flex gap-3 flex-wrap">
              <a href="#projects" className="bg-accent hover:bg-accentLight text-white font-sans font-bold text-sm px-6 py-3 rounded-sm transition-all hover:-translate-y-0.5 shadow-lg shadow-accent/20">
                View Projects →
              </a>
              <a href="#contact" className="border border-white/10 hover:border-accent/40 hover:text-accent text-gray-300 font-sans font-semibold text-sm px-6 py-3 rounded-sm transition-all hover:-translate-y-0.5">
                Get in Touch
              </a>
            </div>
            <div className="fade5 flex items-center gap-8 mt-10 pt-8 border-t border-white/5">
              {[['5+','Projects'],['2+','Years Exp'],['100%','Passion']].map(([n,l])=>(
                <div key={l}>
                  <div className="font-sans font-extrabold text-xl text-white">{n}</div>
                  <div className="text-[11px] text-gray-600 font-mono tracking-wider">{l}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="order-1 lg:order-2">
            <Terminal/>
          </div>
        </div>
      </div>

      {/* SKILLS */}
      <Sec id="skills">
        <Header label="What I work with" title="Skills & Tools"/>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-px bg-white/5 border border-white/5 rounded-lg overflow-hidden">
          {SKILLS.map(s=>(
            <div key={s.name} className="skill-card bg-dark p-5 border border-transparent">
              <div className="text-2xl mb-3">{s.icon}</div>
              <div className="font-sans font-bold text-sm text-white mb-1.5">{s.name}</div>
              <div className="text-[11px] text-gray-600 leading-relaxed font-mono">{s.desc}</div>
            </div>
          ))}
        </div>
      </Sec>

      <div className="max-w-7xl mx-auto px-6"><div className="border-t border-white/5"/></div>

      {/* PROJECTS */}
      <Sec id="projects">
        <Header label="What I'm building" title="Projects"/>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
          {PROJECTS.map(p=>(
            <div key={p.name} className="card border border-white/8 rounded-xl p-6 relative overflow-hidden" style={{background:'rgba(255,255,255,0.02)'}}>
              <div className="topbar absolute top-0 left-0 right-0 h-0.5 bg-accent"/>
              <Badge status={p.status} label={p.label}/>
              <h3 className="font-sans font-bold text-base text-white mt-3 mb-2">{p.name}</h3>
              <p className="text-[12px] text-gray-600 leading-relaxed font-mono mb-4">{p.desc}</p>
              <div className="flex flex-wrap gap-1.5 mb-4">
                {p.tags.map(t=>(
                  <span key={t} className="text-[10px] font-mono px-2 py-0.5 bg-white/5 text-gray-500 rounded-sm border border-white/8">{t}</span>
                ))}
              </div>
              {p.link&&(
                <a href={p.link} target="_blank" className="text-[11px] text-accent hover:text-white font-mono transition-colors">
                  Visit → {p.link.replace('https://','')}
                </a>
              )}
            </div>
          ))}
        </div>
      </Sec>

      <div className="max-w-7xl mx-auto px-6"><div className="border-t border-white/5"/></div>

      {/* CONTACT */}
      <Sec id="contact">
        <Header label="Let's talk" title="Get in Touch"/>
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-16">
          <div>
            <p className="text-gray-500 text-sm font-mono leading-relaxed mb-8">
              Open to freelance projects, collaborations, and interesting opportunities. I'll get back to you within 24 hours.
            </p>
            <div className="flex flex-col gap-3">
              {[
                {icon:'✉',label:'assoadeeq@gmail.com',href:'mailto:assoadeeq@gmail.com'},
                {icon:'◈',label:'github.com/assoadeeqgit',href:'https://github.com/assoadeeqgit'},
                {icon:'◉',label:'lunobyte.com',href:'https://lunobyte.com'},
              ].map(({icon,label,href})=>(
                <a key={label} href={href} target="_blank" className="clink flex items-center gap-3 border border-white/8 rounded-lg px-4 py-3 text-gray-500 text-sm font-mono no-underline">
                  <span className="text-base w-5">{icon}</span>{label}
                </a>
              ))}
            </div>
          </div>
          <form onSubmit={submit} className="flex flex-col gap-4">
            {[{label:'Name',key:'name',type:'text',ph:'Your name'},{label:'Email',key:'email',type:'email',ph:'your@email.com'}].map(({label,key,type,ph})=>(
              <div key={key}>
                <label className="block text-[10px] font-mono tracking-widest uppercase text-gray-600 mb-1.5">{label}</label>
                <input type={type} value={form[key]} onChange={e=>setForm({...form,[key]:e.target.value})} placeholder={ph} required
                  className="w-full bg-dark2 border border-white/8 rounded-lg px-4 py-3 text-white text-sm font-mono placeholder-gray-700 transition-all"/>
              </div>
            ))}
            <div>
              <label className="block text-[10px] font-mono tracking-widest uppercase text-gray-600 mb-1.5">Message</label>
              <textarea value={form.message} onChange={e=>setForm({...form,message:e.target.value})} placeholder="What's on your mind?" required rows={4}
                className="w-full bg-dark2 border border-white/8 rounded-lg px-4 py-3 text-white text-sm font-mono placeholder-gray-700 resize-none transition-all"/>
            </div>
            <button type="submit" className={`${sent?'bg-green-500':'bg-accent hover:bg-accentLight'} text-white font-sans font-bold text-sm px-6 py-3 rounded-sm transition-all w-fit shadow-lg`}>
              {sent?'✓ Sent!':'Send Message →'}
            </button>
          </form>
        </div>
      </Sec>

      {/* FOOTER */}
      <footer className="border-t border-white/5 py-6 px-6">
        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-2 text-[11px] text-gray-700 font-mono">
          <span>© 2026 <span className="text-gray-500">Assoadeeq</span> — assoadeeq.dev</span>
          <span>Built & deployed on <a href="https://digitalocean.com" className="text-accent hover:text-white transition-colors">DigitalOcean</a> · Served by <span className="text-gray-500">NGINX</span></span>
        </div>
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
